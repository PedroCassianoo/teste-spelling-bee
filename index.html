<!DOCTYPE html>
<html class="dark" lang="pt">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Minimalist Word Trainer - Spelling Bee</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#353535",
                        "inverse-on-surface": "#303030",
                        "on-surface": "#e2e2e2",
                        "on-primary": "#2f3131",
                        "primary-fixed-dim": "#c6c6c7",
                        "on-primary-fixed-variant": "#454747",
                        "surface-bright": "#393939",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "background": "#131313",
                        "primary": "#ffffff",
                        "on-error": "#690005",
                        "outline-variant": "#444748",
                        "on-tertiary-fixed": "#1a1c1c",
                        "tertiary-fixed": "#e2e2e2",
                        "tertiary": "#ffffff",
                        "on-secondary": "#303030",
                        "on-tertiary": "#2f3131",
                        "on-primary-fixed": "#1a1c1c",
                        "surface-tint": "#c6c6c7",
                        "primary-fixed": "#e2e2e2",
                        "on-primary-container": "#636565",
                        "on-background": "#e2e2e2",
                        "surface-container-low": "#1b1b1b",
                        "on-tertiary-fixed-variant": "#454747",
                        "tertiary-container": "#e2e2e2",
                        "surface-container-high": "#2a2a2a",
                        "surface-container": "#1f1f1f",
                        "inverse-surface": "#e2e2e2",
                        "inverse-primary": "#5d5f5f",
                        "secondary": "#c6c6c6",
                        "surface-container-lowest": "#0e0e0e",
                        "on-tertiary-container": "#636565",
                        "on-secondary-fixed": "#1b1b1b",
                        "surface": "#131313",
                        "error": "#ffb4ab",
                        "secondary-container": "#474747",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#c6c6c6",
                        "on-secondary-fixed-variant": "#474747",
                        "secondary-fixed": "#e2e2e2",
                        "surface-container-highest": "#353535",
                        "outline": "#8e9192",
                        "primary-container": "#e2e2e2",
                        "error-container": "#93000a",
                        "on-secondary-container": "#b5b5b5",
                        "surface-dim": "#131313",
                        "on-surface-variant": "#c4c7c8"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "sm": "8px",
                        "xl": "48px",
                        "container-max": "1200px",
                        "unit": "4px",
                        "lg": "24px",
                        "gutter": "24px",
                        "md": "16px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "label-lg": ["Inter"],
                        "headline-xl": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-lg": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-xl": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary selection:text-background overflow-x-hidden">
    <!-- TopAppBar -->
    <header class="flex justify-between items-center w-full px-margin-mobile h-16 bg-background text-primary font-label-lg text-label-lg top-0 z-10 sticky no-border flat no shadows">
        <button id="btn-back" aria-label="Voltar" class="text-primary hover:opacity-80 transition-opacity duration-200 flex items-center justify-center p-sm rounded-full active:bg-surface-variant focus:outline-none focus:ring-1 focus:ring-primary cursor-pointer">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
        </button>
        
        <div id="progress-indicator" class="font-headline-md text-headline-md text-primary font-bold tracking-tight">1 / 10</div>

        <!-- Botão de Configurações da API Deepgram & Supabase -->
        <button id="btn-settings" aria-label="Configurações" class="text-primary hover:opacity-80 transition-opacity duration-200 flex items-center justify-center p-sm rounded-full active:bg-surface-variant focus:outline-none focus:ring-1 focus:ring-primary relative cursor-pointer">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
            <span id="key-status-badge" class="w-2 h-2 rounded-full bg-yellow-400 absolute top-1 right-1"></span>
        </button>
    </header>

    <!-- Main Canvas -->
    <main class="flex-grow flex flex-col items-center justify-center px-margin-mobile w-full max-w-container-max mx-auto space-y-lg py-lg relative">
        
        <!-- Feedback Banner -->
        <div id="feedback-banner" class="hidden transition-smooth opacity-0 w-full max-w-sm mx-auto p-3 rounded-full border border-primary bg-surface-container-high text-primary text-center font-label-lg text-xs tracking-wider">
            <span id="feedback-text">Pronto para começar</span>
        </div>

        <!-- Stack Item 1: OUVIR (Deepgram TTS) -->
        <button id="btn-listen" class="group flex flex-col items-center justify-center w-40 h-40 rounded-full border border-primary bg-background text-primary transition-all duration-300 hover:bg-surface-container-low active:bg-primary active:text-background focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background cursor-pointer">
            <span class="material-symbols-outlined text-4xl mb-2 transition-transform group-hover:scale-110 group-active:scale-95" style="font-variation-settings: 'FILL' 0;">volume_up</span>
            <span class="font-label-lg text-label-lg">OUVIR</span>
        </button>

        <!-- Spacer to enforce "Void" Principle -->
        <div aria-hidden="true" class="h-md"></div>

        <!-- Stack Item 2: Speak / Microphone (Deepgram STT) -->
        <div class="flex flex-col items-center space-y-md">
            <button id="btn-mic" class="group flex items-center justify-center w-32 h-32 rounded-full border border-primary bg-background text-primary transition-all duration-300 hover:bg-surface-container-low active:bg-primary active:text-background focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background relative overflow-hidden cursor-pointer">
                <div class="absolute inset-0 rounded-full bg-primary opacity-0 group-active:opacity-20 transition-opacity duration-300 pointer-events-none"></div>
                <span id="mic-icon" class="material-symbols-outlined text-5xl transition-transform group-hover:scale-110 group-active:scale-95 z-10" style="font-variation-settings: 'FILL' 0;">mic</span>
            </button>
            <p id="mic-status-text" class="font-body-md text-body-md text-on-surface-variant opacity-80 select-none text-center max-w-[240px]">
                Clique para falar
            </p>
        </div>
    </main>

    <!-- Footer Action -->
    <footer class="w-full px-margin-mobile pb-margin-mobile pt-md bg-background sticky bottom-0 z-10">
        <div class="max-w-container-max mx-auto w-full">
            <button id="btn-next" class="w-full bg-primary text-background flex items-center justify-center py-md px-lg rounded-full font-label-lg text-label-lg transition-transform duration-200 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background focus:ring-primary group hover:bg-opacity-90 cursor-pointer">
                <span class="mr-sm">PRÓXIMA PALAVRA</span>
                <span class="material-symbols-outlined transition-transform group-hover:translate-x-1" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
            </button>
        </div>
    </footer>

    <!-- Modal de Configuração -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-surface-container border border-outline-variant w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-5">
            <div class="flex justify-between items-center">
                <h3 class="font-headline-md text-headline-md text-primary font-bold">Configurações</h3>
                <button id="btn-close-modal" class="text-on-surface-variant hover:text-primary transition-colors cursor-pointer">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <!-- Deepgram Key -->
            <div class="space-y-2">
                <label for="api-key-input" class="text-xs uppercase tracking-wider font-semibold text-on-surface">Chave Deepgram (TTS & STT):</label>
                <input id="api-key-input" type="password" placeholder="Ex: 8a7b9c..." class="w-full bg-surface-container-lowest border border-outline rounded-xl px-4 py-3 text-primary text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
            </div>

            <!-- Supabase Anon Key -->
            <div class="space-y-2">
                <label for="supabase-key-input" class="text-xs uppercase tracking-wider font-semibold text-on-surface">Supabase Anon Key (Opcional):</label>
                <input id="supabase-key-input" type="password" placeholder="Chave pública do Supabase" class="w-full bg-surface-container-lowest border border-outline rounded-xl px-4 py-3 text-primary text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
            </div>

            <div class="pt-2 flex space-x-3">
                <button id="btn-save-key" class="flex-1 bg-primary text-background font-semibold py-3 rounded-full hover:bg-opacity-90 transition-all cursor-pointer">
                    Salvar Configurações
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts da Aplicação -->
    <script src="js/config.js"></script>
    <script src="js/words.js"></script>
    <script src="js/deepgram.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
